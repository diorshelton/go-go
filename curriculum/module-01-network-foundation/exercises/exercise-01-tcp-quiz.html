<style>
  :root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#388bfd;--accent-dim:#1f6feb;--green:#3fb950;--yellow:#d29922;--red:#f85149;--orange:#ffa657;--radius:6px;--mono:'JetBrains Mono','Fira Code','Cascadia Code',monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.6}
  a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
  .nav{border-bottom:1px solid var(--border);padding:12px 32px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-family:var(--mono)}

  h1{font-size:26px;font-weight:700;margin-bottom:8px}

  .progress-row{display:flex;align-items:center;gap:12px;margin-bottom:32px}
  .prog-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
  .prog-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}

  .q-num{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}

  .option{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;cursor:pointer;font-size:14px;line-height:1.5;transition:border-color .15s,background .15s;text-align:left;color:var(--text);font-family:inherit}

  .option.wrong{border-color:var(--red);background:rgba(248,81,73,.1);color:var(--red)}

  .feedback{display:none;font-size:14px;line-height:1.7;color:var(--muted);padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px}
  .feedback.open{display:block}.feedback strong{color:var(--green)}
  .next-btn{background:var(--accent);border:none;color:#fff;font-size:14px;font-weight:600;padding:10px 20px;border-radius:var(--radius);cursor:pointer;font-family:inherit;display:none}
  .next-btn.visible{display:inline-block}.next-btn:hover{background:var(--accent-dim)}
  .result{display:none;text-align:center;padding:40px 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}

  .result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

  .rb-secondary{background:var(--surface);border:1px solid var(--border);color:var(--text)}.rb-secondary:hover{border-color:var(--accent);color:var(--accent)}

  .nbtn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--muted);padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius);transition:border-color .15s,color .15s}

  .nbtn.p{background:var(--accent);border-color:var(--accent);color:#fff}.nbtn.p:hover{background:var(--accent-dim);color:#fff}

<body>

<main class="wrap">
  <div class="eyebrow">Module 01 · Exercise 01</div>
  <h1>TCP Fundamentals Quiz</h1>
  <p class="subtitle">8 questions. These cover the core ideas from Lessons 1–3. Answer each one before looking at the explanation.</p>

  <div class="progress-row">
    <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    <div class="prog-label" id="progLabel">0 / 8</div>
  </div>

  <div id="quiz"></div>

  <div class="result" id="result">
    <div class="score" id="scoreVal"></div>
    <div class="score-label">correct out of 8</div>
    <div class="result-actions">
      <button class="result-btn rb-secondary" onclick="restart()">Retry</button>
      <a href="exercise-02-tcp-echo-server.html" class="result-btn rb-primary">Exercise 2 — Echo Server →</a>
    </div>
  </div>

  <div class="footer">
    <a href="../lesson-03-net-listen-accept.html" class="nbtn">← Lesson 3</a>
    <button class="done-btn" id="db" onclick="markDone()">Mark complete</button>
    <a href="exercise-02-tcp-echo-server.html" class="nbtn p">Exercise 2 — Echo Server →</a>
  </div>
</main>
<script>
var QUESTIONS = [
  {
    q: "What does a TCP connection guarantee that raw IP packets do not?",
    options: ["Encryption of data in transit","Ordered, reliable, duplicate-free delivery","Faster transmission speed","Compression of transmitted bytes"],
    correct: 1,
    explain: "<strong>Ordered, reliable, duplicate-free delivery.</strong> Raw IP is best-effort — packets can arrive out of order, be duplicated, or be dropped. TCP adds sequence numbers, acknowledgements, and retransmission to guarantee that bytes arrive in order with no gaps or duplicates."
  },
  {
    q: "In the 3-way handshake, which message does the client send first?",
    options: ["ACK","SYN-ACK","SYN","FIN"],
    correct: 2,
    explain: "<strong>SYN.</strong> The client initiates by sending a SYN (synchronize) packet containing its starting sequence number. The server responds with SYN-ACK, and the client completes the handshake with ACK. Three messages, connection established."
  },
  {
    q: "When does net.Accept() return in Go?",
    options: ["Immediately after net.Listen() is called","After the OS completes the 3-way handshake for one connection","After the first HTTP request arrives on the connection","After all workers are idle"],
    correct: 1,
    explain: "<strong>After the OS completes the 3-way handshake.</strong> Accept() dequeues one fully-established connection from the OS backlog. The handshake is already complete by the time your code sees the net.Conn — you can immediately start reading data."
  },
  {
    q: "What is the OS listen backlog?",
    options: ["A log file of incoming connections","A queue of fully-established connections waiting to be Accept()ed","A buffer for storing incoming HTTP requests","A list of worker goroutines"],
    correct: 1,
    explain: "<strong>A queue of fully-established connections waiting for Accept().</strong> Between when a connection finishes its handshake and when your code calls Accept(), the OS holds it in this queue. If the queue is full (because Accept() isn't being called fast enough), new connections are rejected by the OS."
  },
  {
    q: "What should the accept loop do between calling Accept() and the next iteration?",
    options: ["Parse the first line of the HTTP request","Log the client's IP address to a file","Send the connection to the worker pool and nothing else","Read headers to decide which worker should handle it"],
    correct: 2,
    explain: "<strong>Send the connection to the worker pool and nothing else.</strong> Any work you do in the accept loop directly slows down how fast you drain the OS backlog. The only two operations per iteration are: call Accept(), send to channel."
  },
  {
    q: "go-go uses a fixed worker pool instead of spawning one goroutine per connection. What does this protect against?",
    options: ["TCP connection timeouts","Unbounded memory consumption under high load","HTTP parsing errors","Slow client disconnects"],
    correct: 1,
    explain: "<strong>Unbounded memory consumption.</strong> Each goroutine costs stack memory and scheduler overhead. With one-goroutine-per-connection and 100,000 concurrent clients, you'd spawn 100,000 goroutines. A fixed pool caps resource usage at a predictable level regardless of incoming load."
  },
  {
    q: "How does closing the listener (ln.Close()) trigger a clean shutdown of the accept loop?",
    options: ["It sends a SIGKILL to all worker goroutines","It causes the next Accept() call to return an error","It drains the connection channel automatically","It closes all existing net.Conn objects"],
    correct: 1,
    explain: "<strong>Accept() returns an error.</strong> When the listener is closed, any blocking Accept() call unblocks and returns a non-nil error. Your accept loop checks for this error and exits. Existing connections held by workers are not affected — they continue until the worker handles them."
  },
  {
    q: "Read() on a net.Conn blocks until data arrives. What does this mean for a single-goroutine server trying to handle two connections?",
    options: ["It can handle them in parallel using channels","It must handle them sequentially — reading one blocks the other","It can use SetDeadline to read both simultaneously","There is no issue since TCP handles the scheduling"],
    correct: 1,
    explain: "<strong>Sequential handling means blocking.</strong> If Read() on connection A is waiting for data and connection B also has data ready, a single goroutine cannot serve B until A unblocks. This is the fundamental reason you need concurrency — either goroutines or non-blocking I/O — to handle multiple connections. go-go uses goroutines (the worker pool)."
  }
];

var current = 0, score = 0, answered = false;

function render() {
  var qc = document.getElementById('quiz');
  qc.innerHTML = '';
  QUESTIONS.forEach(function(q, i) {
    var div = document.createElement('div');
    div.className = 'question' + (i === current ? ' active' : '');
    div.id = 'q' + i;
    var opts = q.options.map(function(o, j) {
      return '<button class="option" onclick="answer(' + i + ',' + j + ')">' + o + '</button>';
    }).join('');
    div.innerHTML = '<div class="q-num">Question ' + (i+1) + ' of ' + QUESTIONS.length + '</div>' +
      '<div class="q-text">' + q.q + '</div>' +
      '<div class="options">' + opts + '</div>' +
      '<div class="feedback" id="fb' + i + '">' + q.explain + '</div>' +
      '<button class="next-btn" id="nb' + i + '" onclick="next(' + i + ')">' + (i < QUESTIONS.length-1 ? 'Next question →' : 'See results') + '</button>';
    qc.appendChild(div);
  });
  updateProgress();
}

function answer(qi, oi) {
  if (answered) return;
  answered = true;
  var q = QUESTIONS[qi];
  var opts = document.querySelectorAll('#q' + qi + ' .option');
  opts.forEach(function(o) { o.disabled = true; });
  opts[oi].classList.add(oi === q.correct ? 'correct' : 'wrong');
  if (oi !== q.correct) opts[q.correct].classList.add('correct');
  if (oi === q.correct) score++;
  document.getElementById('fb' + qi).classList.add('open');
  document.getElementById('nb' + qi).classList.add('visible');
}

function next(qi) {
  answered = false;
  if (qi < QUESTIONS.length - 1) {
    document.getElementById('q' + qi).classList.remove('active');
    current = qi + 1;
    document.getElementById('q' + current).classList.add('active');
    updateProgress();
  } else {
    document.getElementById('quiz').style.display = 'none';
    document.getElementById('scoreVal').textContent = score + ' / ' + QUESTIONS.length;
    document.getElementById('result').classList.add('open');
    if (score >= 6) { localStorage.setItem('gogo_m01_e01','1'); document.getElementById('db').textContent='✓ Complete'; document.getElementById('db').classList.add('done'); }
  }
}

function updateProgress() {
  var pct = Math.round((current / QUESTIONS.length) * 100);
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progLabel').textContent = current + ' / ' + QUESTIONS.length;
}

function restart() {
  current = 0; score = 0; answered = false;
  document.getElementById('result').classList.remove('open');
  document.getElementById('quiz').style.display = '';
  render();
}

function markDone(){localStorage.setItem('gogo_m01_e01','1');var b=document.getElementById('db');b.textContent='✓ Complete';b.classList.add('done');}
(function(){if(localStorage.getItem('gogo_m01_e01')){var b=document.getElementById('db');b.textContent='✓ Complete';b.classList.add('done');}render();})();
</script>
</body>
