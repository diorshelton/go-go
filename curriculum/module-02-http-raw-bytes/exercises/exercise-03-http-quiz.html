<style>
  :root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#388bfd;--accent-dim:#1f6feb;--green:#3fb950;--yellow:#d29922;--red:#f85149;--orange:#ffa657;--radius:6px;--mono:'JetBrains Mono','Fira Code','Cascadia Code',monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.6}
  a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
  .nav{border-bottom:1px solid var(--border);padding:12px 32px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-family:var(--mono)}
  .nav a{color:var(--muted)}.nav a:hover{color:var(--text)}.nav-sep{color:var(--border)}.nav-cur{color:var(--text)}
  .wrap{max-width:700px;margin:0 auto;padding:48px 24px 80px}
  .eyebrow{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
  h1{font-size:26px;font-weight:700;margin-bottom:8px}
  .subtitle{color:var(--muted);font-size:14px;margin-bottom:40px;padding-bottom:24px;border-bottom:1px solid var(--border)}
  .prog-row{display:flex;align-items:center;gap:12px;margin-bottom:32px}
  .prog-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
  .prog-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
  .prog-label{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
  .question{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:20px;display:none}
  .question.active{display:block}
  .q-num{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
  .q-text{font-size:17px;font-weight:500;margin-bottom:20px;line-height:1.5}
  .options{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
  .option{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;cursor:pointer;font-size:14px;line-height:1.5;transition:border-color .15s,background .15s;text-align:left;color:var(--text);font-family:inherit}
  .option:hover:not([disabled]){border-color:var(--accent);background:rgba(56,139,253,.06)}
  .option.correct{border-color:var(--green);background:rgba(63,185,80,.1);color:var(--green)}
  .option.wrong{border-color:var(--red);background:rgba(248,81,73,.1);color:var(--red)}
  .option[disabled]{cursor:default}
  .feedback{display:none;font-size:14px;line-height:1.7;color:var(--muted);padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px}
  .feedback.open{display:block}.feedback strong{color:var(--green)}
  .next-btn{background:var(--accent);border:none;color:#fff;font-size:14px;font-weight:600;padding:10px 20px;border-radius:var(--radius);cursor:pointer;font-family:inherit;display:none}
  .next-btn.visible{display:inline-block}.next-btn:hover{background:var(--accent-dim)}
  .result{display:none;text-align:center;padding:40px 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
  .result.open{display:block}
  .score{font-size:48px;font-weight:700;font-family:var(--mono);color:var(--green);margin-bottom:8px}
  .score-label{color:var(--muted);font-size:14px;margin-bottom:24px}
  .result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .rb{padding:10px 20px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;border:none;text-decoration:none;display:inline-flex;align-items:center}
  .rb-p{background:var(--accent);color:#fff}.rb-p:hover{background:var(--accent-dim);color:#fff}
  .rb-s{background:var(--surface);border:1px solid var(--border);color:var(--text)}
  .footer{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--border)}
  .nbtn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--muted);padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius);transition:border-color .15s,color .15s}
  .nbtn:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
  .nbtn.p{background:var(--accent);border-color:var(--accent);color:#fff}.nbtn.p:hover{background:var(--accent-dim);color:#fff}
  .done-btn{background:transparent;border:1px solid var(--green);color:var(--green);font-size:13px;padding:8px 14px;border-radius:var(--radius);cursor:pointer;font-family:inherit;transition:background .15s}
  .done-btn:hover{background:rgba(63,185,80,.1)}.done-btn.done{background:rgba(63,185,80,.15)}
</style>

<body>

<main class="wrap">
  <div class="eyebrow">Module 02 · Exercise 03</div>
  <h1>HTTP Fundamentals Quiz</h1>
  <p class="subtitle">8 questions covering Module 2 — request structure, parsing strategy, keep-alive, and the decisions your parser must make.</p>

  <div class="prog-row">
    <div class="prog-bar"><div class="prog-fill" id="pf" style="width:0%"></div></div>
    <div class="prog-label" id="pl">0 / 8</div>
  </div>

  <div id="quiz"></div>

  <div class="result" id="result">
    <div class="score" id="sv"></div>
    <div class="score-label">correct out of 8</div>
    <div class="result-actions">
      <button class="rb rb-s" onclick="restart()">Retry</button>
      <a href="../../module-03-concurrency/lesson-01-goroutines-channels.html" class="rb rb-p">Module 3, Lesson 1 →</a>
    </div>
  </div>

  <div class="footer">
    <a href="exercise-02-spot-malformed.html" class="nbtn">← Exercise 2</a>
    <button class="done-btn" id="db" onclick="markDone()">Mark complete</button>
    <a href="../../module-03-concurrency/lesson-01-goroutines-channels.html" class="nbtn p">Module 3 →</a>
  </div>
</main>
<script>
var QS=[
  {q:"What terminates a header line in HTTP/1.1?",opts:["\\n (LF only)","\\r\\n (CRLF)","A semicolon","A blank space"],correct:1,exp:"<strong>CRLF (\\r\\n).</strong> HTTP/1.1 requires carriage return + line feed to terminate each header line. Many servers tolerate \\n alone for resilience, but the spec is strict. The end of headers is signaled by a bare CRLF — a line with nothing before the \\r\\n."},
  {q:"Why does go-go normalize header names to lowercase during parsing?",opts:["It's required by the HTTP/1.1 spec","HTTP header names are case-insensitive, so normalization enables consistent lookup","It reduces memory usage","Lowercase headers parse faster"],correct:1,exp:"<strong>Case-insensitive by spec, normalized for consistent lookup.</strong> RFC 7230 states that header field names are case-insensitive. Rather than doing a case-insensitive comparison on every lookup, normalizing once at parse time (with strings.ToLower) makes all subsequent map lookups simple and O(1)."},
  {q:"What does io.ReadFull do that a plain Read() call doesn't?",opts:["Reads bytes faster using vectorized I/O","Blocks until exactly N bytes have been read, handling partial reads internally","Validates that bytes are valid UTF-8","Automatically sets a read deadline"],correct:1,exp:"<strong>Handles partial reads.</strong> TCP can deliver bytes in chunks — a 500-byte body might arrive as 300 bytes then 200 bytes. A single Read() might return only the first chunk. io.ReadFull loops until it has all N bytes or encounters an error, making it the correct primitive for reading a known-length body."},
  {q:"In HTTP/1.1, what is the default connection behavior when no Connection header is sent?",opts:["Close after each response (HTTP/1.0 behavior)","Keep-alive — the connection stays open","The server decides based on request method","Undefined — the server must ask the client"],correct:1,exp:"<strong>Keep-alive by default.</strong> HTTP/1.1 changed the default from HTTP/1.0's close-after-request to persistent connections. A client sending no Connection header expects the connection to remain open. Only Connection: close explicitly signals the server to close after responding."},
  {q:"Why is Content-Length required in responses on keep-alive connections?",opts:["It's required by the HTTP spec for all responses","Without it, the client cannot determine where one response ends and the next begins","It helps the client cache the response","It's needed for compression"],correct:1,exp:"<strong>Response framing.</strong> On a persistent connection, multiple responses flow over the same TCP stream. Without Content-Length (or chunked encoding), the client can't tell when one response ends and the next begins. For go-go, every response must include the correct Content-Length."},
  {q:"What happens to the bufio.Reader when you move to the next request in the keep-alive loop?",opts:["Create a new bufio.Reader for each request","Reuse the same reader — it may have buffered bytes from the previous read","Reset the reader's internal buffer manually","The reader automatically discards old bytes"],correct:1,exp:"<strong>Reuse the same reader.</strong> bufio.Reader reads ahead — when you read headers, it might have already buffered the start of the next request. Creating a new reader discards those buffered bytes. The same reader, wrapping the same conn, must be used throughout the connection's lifetime."},
  {q:"What should your parser return if Content-Length is present but cannot be parsed as a number?",opts:["Use 0 as the default","Return 400 Bad Request","Skip the body and continue","Return 411 Length Required"],correct:0,exp:"<strong>400 Bad Request.</strong> If Content-Length: abc arrives, strconv.Atoi returns an error. You have no reliable way to know the body length, so you cannot safely read the request. Return 400 and close or reset the connection."},
  {q:"A client connects and sends nothing for 60 seconds. What happens in go-go's worker?",opts:["The worker goroutine blocks indefinitely on Read()","The read deadline fires, ReadString returns a timeout error, the connection closes","The OS automatically closes the idle connection","The worker detects the idle connection and sends a ping"],correct:1,exp:"<strong>The read deadline fires.</strong> Before each read cycle, go-go calls conn.SetReadDeadline(time.Now().Add(30 * time.Second)). If no data arrives within 30 seconds, the deadline fires and Read returns a net.Error with Timeout() == true. The keep-alive loop detects this error, exits, and the defer conn.Close() cleans up. The worker goroutine is released back to the pool."}
];
var cur=0,score=0,answered=false;
function render(){
  var qc=document.getElementById('quiz');qc.innerHTML='';
  QS.forEach(function(q,i){
    var div=document.createElement('div');div.className='question'+(i===cur?' active':'');div.id='q'+i;
    var opts=q.opts.map(function(o,j){return '<button class="option" onclick="ans('+i+','+j+')">'+o+'</button>';}).join('');
    div.innerHTML='<div class="q-num">Question '+(i+1)+' of '+QS.length+'</div><div class="q-text">'+q.q+'</div><div class="options">'+opts+'</div><div class="feedback" id="fb'+i+'">'+q.exp+'</div><button class="next-btn" id="nb'+i+'" onclick="nxt('+i+')">'+(i<QS.length-1?'Next question →':'See results')+'</button>';
    qc.appendChild(div);
  });
  upd();
}
function ans(qi,oi){if(answered)return;answered=true;var q=QS[qi],opts=document.querySelectorAll('#q'+qi+' .option');opts.forEach(function(o){o.disabled=true;});opts[oi].classList.add(oi===q.correct?'correct':'wrong');if(oi!==q.correct)opts[q.correct].classList.add('correct');if(oi===q.correct)score++;document.getElementById('fb'+qi).classList.add('open');document.getElementById('nb'+qi).classList.add('visible');}
function nxt(qi){answered=false;if(qi<QS.length-1){document.getElementById('q'+qi).classList.remove('active');cur=qi+1;document.getElementById('q'+cur).classList.add('active');upd();}else{document.getElementById('quiz').style.display='none';document.getElementById('sv').textContent=score+' / '+QS.length;document.getElementById('result').classList.add('open');if(score>=6){localStorage.setItem('gogo_m02_e03','1');document.getElementById('db').textContent='✓ Complete';document.getElementById('db').classList.add('done');}}}
function upd(){var p=Math.round(cur/QS.length*100);document.getElementById('pf').style.width=p+'%';document.getElementById('pl').textContent=cur+' / '+QS.length;}
function restart(){cur=0;score=0;answered=false;document.getElementById('result').classList.remove('open');document.getElementById('quiz').style.display='';render();}
function markDone(){localStorage.setItem('gogo_m02_e03','1');var b=document.getElementById('db');b.textContent='✓ Complete';b.classList.add('done');}
(function(){if(localStorage.getItem('gogo_m02_e03')){var b=document.getElementById('db');b.textContent='✓ Complete';b.classList.add('done');}render();})();
</script>
</body>
